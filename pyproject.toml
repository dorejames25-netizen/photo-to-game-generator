[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-to-game-generator"
version = "0.1.0"
description = "Turn real photographs into original, game-ready retro art"
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.8", "numpy>=1.24", "pillow>=10.0"]

[project.optional-dependencies]
cutout = ["rembg"]
dev = ["pytest"]

[project.scripts]
ptg = "ptg.cli:main"

[tool.setuptools]
packages = ["ptg"]

[tool.setuptools.package-data]
ptg = ["presets/*.json"]
